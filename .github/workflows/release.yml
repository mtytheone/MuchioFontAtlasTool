name: Build Release

# package.json の version を上げてから、Actions タブで手動実行する。
# タグとリリースが作られ、VPM リスティングが拾う zip が添付される。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json からバージョンを取得する
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@b9f36ce6ee6fe2680cd3c32b2c62e22eade7e590
        with:
          file_path: "package.json"
          prop_path: "version"

      - name: Set Environment Variables
        run: |
          echo "packageName=$(jq -r .name package.json)" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      # このリポジトリはルートがパッケージなので、zip の出力先を
      # ワークスペース外（runner.temp）にしないと自分自身を巻き込む
      - name: Create Package Zip
        run: |
          zip -r "${{ runner.temp }}/${{ env.packageName }}-${{ env.version }}.zip" . \
            -x ".git/*" ".github/*" ".gitignore"

      - name: Create Tag
        uses: rickstaa/action-create-tag@88dbf7ff6fe2405f8e8f6c6fdfd78829bc631f83
        with:
          tag: "${{ env.version }}"

      # VPM リスティングは package.json と zip を参照する
      - name: Make Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: |
            ${{ runner.temp }}/${{ env.packageName }}-${{ env.version }}.zip
            package.json
          tag_name: ${{ env.version }}
